# Gaussian variant of the point-head reference; pretrained encoder stays frozen.
# Change settings explicitly with train.py fit --set key=value.
backbone = "dino"
pretrained = true
freeze_backbone = true
hidden_dim = 256
dropout = 0.1
seed = 42
epochs = 30
batch_size = 32
workers = 4
device = "cuda"
precision = "float32"
compile_model = true
compile_backend = "inductor"
compile_mode = "default"
compile_fullgraph = true
compile_dynamic = true
wandb_mode = "online"
wandb_project = "macs-nutrition5k"
wandb_group = "gaussian-heads"
head_lr = 0.001
backbone_lr = 1e-05
weight_decay = 0.01
optimizer = "adamw"
betas = [0.9, 0.999]
eps = 1e-08
scheduler = "cosine"
loss = "gaussian_nll"
gaussian_min_std = 0.001
gaussian_initial_std = 1.0
huber_beta = 1.0
grad_clip = 1.0
augmentation = "none"
targets = ["calories_kcal", "protein_g", "carbs_g", "fat_g", "mass_g"]
