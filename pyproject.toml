[project]
name = "macs-nutrition-eval"
version = "0.1.0"
description = "Small, backend-independent Nutrition5k image evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-codex>=0.160.0",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["data", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
exclude = ["data", "runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
